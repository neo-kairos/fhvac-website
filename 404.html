<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found | Forest Hills Volunteer Ambulance Corps</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #eefaf4 0%, #d9f0e5 100%);
            color: #123524; /* darker text for readability */
            color: #ffffff;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 24px;
        }

        .content {
            max-width: 500px;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 2.2em;
            color: #145c38; /* dark green heading */
            margin-bottom: 12px;
        }

        p {
            font-size: 1.05em;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        a {
            color: #1f7a4c;
            font-weight: bold;
        }

        a:focus,
        a:hover {
            outline: 2px solid #9dffb8;
            outline-offset: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .content { animation: none; }
        }

        /* Automatic dark mode */
        @media (prefers-color-scheme: dark) {
            html, body {
                background: linear-gradient(180deg, #0f2f1f 0%, #0b2418 100%);
                color: #e6fff3;
            }

            h1 {
                color: #7cfc9a;
            }

            a {
                color: #9dffb8;
            }
        }
        }
    </style>
</head>
<body>

<main class="container" role="main">
    <section class="content" aria-labelledby="error-title">
        <h1 id="error-title">404 – Page Not Found</h1>
        <p>
            The page you are looking for does not exist or may have been moved.
        </p>
        <p>
            <a href="index.html">Return to the home page</a>
        </p>
        <p>
            Forest Hills Volunteer Ambulance Corps<br>
            Serving local communities in Queens, New York City
        </p>
    </section>
</main>

</body>
</html>
